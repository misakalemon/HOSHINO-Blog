# Selenium 独立 Chrome 容器（仅供 B站 爬虫/浏览器任务使用）。
# 应用本体（Flask/MySQL/Redis）不在本编排中，请按 README 本地部署。
#
# 注意：截至当前版本，代码中已无 selenium 引用（浏览器采集链路已下线，
#       selenium 亦已从 requirements.txt 移除）。本文件保留以备将来复用
#       （例如需要 JS 渲染的动态页采集）；若确认不再使用可整体删除。
services:
  chrome:
    image: selenium/standalone-chrome:4.28.1
    container_name: hoshino-chrome
    restart: unless-stopped
    ports:
      - "127.0.0.1:4444:4444"
    shm_size: 2g
    environment:
      # 请通过 .env 或环境变量注入强随机密码（勿使用默认值）
      - SE_VNC_PASSWORD=${SE_VNC_PASSWORD:-changeme}
      - SE_NODE_MAX_SESSIONS=8
      - SE_SESSION_REQUEST_TIMEOUT=300
      - SE_NODE_SESSION_TIMEOUT=600
    networks:
      - hoshino_net

networks:
  hoshino_net:
    name: hoshino_net
