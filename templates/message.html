<!-- ============================================================
     通用结果消息页 (message.html)
     用途：订阅验证成功/取消订阅/错误提示等单按钮结果页
     继承：base.html
     模板变量：
       - title        : 页面标题
       - message      : 消息正文
       - button_text  : 按钮文字
       - button_url   : 按钮链接
     ============================================================ -->
{% extends 'base.html' %}
{% block title %}{{ title }} - Hoshino{% endblock %}
{% block content %}
<div class="content message-page">
    <div class="glass-card message-card">
        <div class="message-icon">
            {% if type == 'success' %}✅
            {% elif type == 'error' %}❌
            {% else %}ℹ️{% endif %}
        </div>
        <h1 class="message-title">{{ title }}</h1>
        <p class="message-text">{{ message }}</p>
        <a href="{{ url_for('bili_public.index') }}" class="btn btn-primary">返回 B站 UP 主</a>
    </div>
</div>
{% endblock %}
